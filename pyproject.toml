[project]
name = "trace-vault"
version = "0.1.0"
description = "A model-agnostic record/replay reliability gate for tool-using agents — scores Determinism and Faithfulness as two independent, CI-gateable axes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Beamus Wayne", email = "fgotbe@gmail.com" }]
keywords = [
    "ai-agents",
    "llm",
    "evaluation",
    "reliability",
    "record-replay",
    "determinism",
    "faithfulness",
    "agent-harness",
    "ci-gate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
]

[project.optional-dependencies]
# Real LLM adapters — strictly optional. The default path (Fake + Cassette
# providers) never imports these, so the offline-green invariant always holds.
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.34"]
otel = ["opentelemetry-sdk>=1.25"]

[project.scripts]
vault = "trace_vault.cli:app"

[project.urls]
Homepage = "https://github.com/BeamusWayne/trace-vault"
Repository = "https://github.com/BeamusWayne/trace-vault"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_vault"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: fast pure-function tests",
    "integration: cross-module tests against the in-process world",
    "e2e: full agent -> eval -> gate pipeline tests",
]

[tool.coverage.run]
branch = true
source = ["src/trace_vault"]
# Optional, opt-in adapters that need extras / a live key — never on the
# offline default path, so excluded from the offline coverage bar.
omit = [
    "src/trace_vault/providers/real.py",
    "src/trace_vault/observability/otel.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) in argument defaults is the idiomatic Typer pattern.
"src/trace_vault/cli.py" = ["B008"]
