name: CI

on:
  push:
    branches: [main]
  pull_request:

# The whole point of trace-vault: this job needs NO secrets and NO network.
# Replay is offline by definition, so CI runs the entire agent -> cassette ->
# eval -> gate -> ledger pipeline deterministically.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (offline-by-design deps only)
        run: uv pip install --system -e . pytest pytest-cov ruff

      - name: Lint
        run: ruff check src tests

      - name: Run the full offline suite with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Prove the gate is green on the committed baseline
        run: vault gate --baseline examples/baseline.json
